<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>红军长征地图 · 二万五千里</title>
    <meta
      name="description"
      content="红军长征可视化：四支主力连续行军路线、三级比例尺信息分级、六大战役动态态势剧场与重要战略地标。数据标注来源与置信度。"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" data-scale="l1">
      <div id="map" class="lm-map"></div>

      <!-- 顶部标识 -->
      <header class="lm-topbar">
        <div class="lm-brand">
          <div class="lm-brand__star" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2.4l2.7 5.9 6.4.8-4.7 4.4 1.2 6.3L12 16.8 6.4 19.8l1.2-6.3L2.9 9.1l6.4-.8z"/></svg>
          </div>
          <div class="lm-brand__text">
            <h1>红军长征地图</h1>
            <p>1934.10 — 1936.10 · 主线贯通 · 六大战役场景动态推演</p>
          </div>
        </div>
        <nav class="lm-actions">
          <span class="lm-scale-pill" id="scale-pill" title="缩放地图自动切换信息密度">小比例尺 · 全国总览</span>
          <button class="lm-btn" id="btn-situation" type="button" title="切入并循环演播核心战役场景">
            <span class="lm-btn__dot"></span>战役剧场
          </button>
          <button class="lm-btn lm-btn--ghost" id="btn-overview" type="button" title="回到全国长征走廊总视野">全局总览</button>
          <button class="lm-btn lm-btn--ghost" id="btn-about" type="button">关于数据</button>
        </nav>
      </header>

      <!-- 图层控制 -->
      <aside class="lm-panel lm-layers" id="layers">
        <button class="lm-panel__toggle" id="layers-toggle" type="button" aria-expanded="true">
          图层
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" /></svg>
        </button>
        <div class="lm-layers__body">
          <section>
            <h3>部队主线</h3>
            <div class="lm-legend" id="legend-armies"></div>
          </section>
          <section>
            <h3>态势与地标</h3>
            <div class="lm-legend" id="legend-extras">
              <div class="lm-legend__item" id="toggle-enemy-ov">
                <span class="lm-legend__swatch lm-legend__swatch--enemy"></span>
                <span class="lm-legend__label" title="敌我战役与围追态势">敌我战役与围追态势</span>
                <span class="lm-legend__count">动态</span>
              </div>
              <div class="lm-legend__item" id="toggle-landmarks">
                <span class="lm-legend__swatch lm-legend__swatch--landmark"></span>
                <span class="lm-legend__label" title="战略重镇（贵阳·昆明等）">战略重镇（贵阳·昆明等）</span>
                <span class="lm-legend__count">28</span>
              </div>
              <div class="lm-legend__item" id="toggle-geo-labels">
                <span class="lm-legend__swatch lm-legend__swatch--geo"></span>
                <span class="lm-legend__label" title="省区与水系底纹">省区与水系底纹</span>
                <span class="lm-legend__count">20</span>
              </div>
            </div>
          </section>
          <section>
            <h3>历史节点</h3>
            <div class="lm-legend lm-legend--check" id="legend-kinds"></div>
          </section>
          <section class="lm-linekey">
            <h3>比例尺与读图</h3>
            <p><i class="lm-linekey__sample lm-linekey__sample--past"></i><span class="lm-linekey__text" title="实线 · 已走主线（连续推进）">实线 · 已走主线（连续推进）</span></p>
            <p><i class="lm-linekey__sample lm-linekey__sample--future"></i><span class="lm-linekey__text" title="虚线 · 未走路线（前方保留）">虚线 · 未走路线（前方保留）</span></p>
            <p><i class="lm-linekey__sample lm-linekey__sample--enemy"></i><span class="lm-linekey__text" title="动态箭头/锯齿 · 敌我态势推演">动态箭头/锯齿 · 敌我态势推演</span></p>
            <p><i class="lm-linekey__sample lm-linekey__sample--landmark"></i><span class="lm-linekey__text" title="双环城标 · 贵阳/昆明等战略支点">双环城标 · 贵阳/昆明等战略支点</span></p>
            <p class="lm-linekey__note">小比例尺精简留白突出路线；放大地图或演播下方六大战役场景时，自动展开重镇、渡口与战术动画。</p>
          </section>
        </div>
      </aside>

      <!-- 战役场景剧场悬浮卡（不隐藏主路线与时间轴） -->
      <aside class="lm-scene-hud" id="scene-hud" aria-hidden="true"></aside>

      <!-- 节点详情抽屉 -->
      <aside class="lm-detail" id="detail" aria-hidden="true">
        <button class="lm-detail__close" id="detail-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" /></svg>
        </button>
        <div class="lm-detail__body" id="detail-body"></div>
      </aside>

      <!-- 底部时间轴 + 六大战役场景导览芯片 -->
      <footer class="lm-timeline" id="timeline">
        <div class="lm-scene-strip" id="scene-strip" aria-label="六大核心战役场景直达"></div>
        <div class="lm-timeline__head">
          <button class="lm-play" id="btn-play" type="button" aria-label="播放长征进程">
            <svg class="lm-play__icon" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" /></svg>
            <svg class="lm-play__pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
          </button>
          <div class="lm-clock">
            <span class="lm-clock__date" id="clock-date">1934 年 10 月 10 日</span>
            <span class="lm-clock__sub" id="clock-sub">中央红军自瑞金出发</span>
          </div>
          <div class="lm-timeline__controls">
            <button type="button" class="lm-follow-btn is-on" id="btn-follow">镜头跟随 · 开</button>
            <div class="lm-speed">
              <button type="button" data-speed="0.5">0.5×</button>
              <button type="button" data-speed="1" class="is-on">1×</button>
              <button type="button" data-speed="2">2×</button>
              <button type="button" data-speed="4">4×</button>
            </div>
          </div>
        </div>
        <div class="lm-track" id="track">
          <div class="lm-track__rail"><div class="lm-track__fill" id="track-fill"></div></div>
          <div class="lm-track__ticks" id="track-ticks"></div>
          <input
            type="range"
            id="time-slider"
            min="0"
            max="1000"
            value="0"
            step="1"
            aria-label="长征时间轴"
          />
        </div>
      </footer>

      <!-- 数据说明弹层 -->
      <div class="lm-modal" id="about" aria-hidden="true">
        <div class="lm-modal__inner">
          <button class="lm-modal__close" id="about-close" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" /></svg>
          </button>
          <div class="lm-modal__body" id="about-body"></div>
        </div>
      </div>

      <div class="lm-loading" id="loading"><span></span>正在展开地形沙盘…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
